name: Patch English lesson links

on:
  push:
    branches:
      - agent/english-learning-progress
    paths:
      - .github/workflows/patch-english-readme.yml

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/english-learning-progress

      - name: Insert completed lesson links
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          marker = "<h2>🇬🇧 Английский язык</h2>\n\n<h6>2026</h6>\n\n"
          block = (
              "- [2026. English File Fourth Edition Elementary (A1/A2). 1.1 — introduction](./english/README.md#11--introduction)\n"
              "- [2026. English File Fourth Edition Elementary (A1/A2). 1.2 — questions with `to be`](./english/README.md#12--questions-with-to-be)\n"
              "- [2026. English File Fourth Edition Elementary (A1/A2). 1.3 — `he / she / they`, negatives](./english/README.md#13--he--she--they-negatives)\n"
          )

          if marker not in text:
              raise SystemExit("English 2026 section marker not found")

          if block not in text:
              text = text.replace(marker, marker + block, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit README change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "link completed English lessons"
            git push origin HEAD:agent/english-learning-progress
          fi
